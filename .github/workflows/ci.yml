name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: >-
          python -m pytest -q
          apps/api/tests/test_agent_run_api.py
          apps/api/tests/test_provider_call_recorder.py
          apps/api/tests/test_provider_call_read_api.py
          apps/api/tests/test_quality_cost_summary_api.py
          apps/api/tests/test_provider_call_chain_behavior.py

  # Spec 007 quality baseline (Batch A): contract/report, three-language
  # compiler matrix, item-count budget curve, and the Wolfram/code MCP funnels
  # on a throwaway Postgres + the runner's real toolchain. Runs the 132-item
  # baseline exactly once (packet §11.7); compiler/Postgres missing FAILs.
  quality-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hello_agents
          POSTGRES_PASSWORD: hello_agents
          POSTGRES_DB: hello_agents
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hello_agents -d hello_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Install compiler toolchain (javac, g++)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-jdk-headless g++
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q apps/api/tests/quality_baseline/
        env:
          DATABASE_URL: postgresql+psycopg://hello_agents:hello_agents@localhost:55432/hello_agents

  # Controlled system Gate (Spec 006): real API + Redis workers + Postgres + the
  # REAL MCP clients against controlled fakes (Practice + Tutor double MCP).
  controlled-system:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/system-test.sh

  orchestration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hello_agents
          POSTGRES_PASSWORD: hello_agents
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hello_agents -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - run: pip install -r apps/api/requirements-dev.txt
      - run: >-
          python -m pytest -q
          apps/api/tests/test_four_chain_orchestration_postgres.py

  # Browser Smoke (Spec 006 §4.4, packet §8): Chromium-only. Java/C++ full path,
  # scientific Practice Wolfram required/negative, Tutor code/Wolfram required/
  # negative — all through the real UI/API/worker/MCP against controlled fakes.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: sh scripts/browser-test.sh
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
